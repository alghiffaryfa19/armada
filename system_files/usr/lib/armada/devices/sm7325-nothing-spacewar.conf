ARMADA_DEVICE_ID=sm7325-nothing-spacewar
ARMADA_DEVICE_NAME='Nothing Phone 1'
ARMADA_SOC_CLASS=SM7325

# 12.4" 3:2 internal panel. The tablet boots landscape; gamescope keeps its
# native orientation (unlike the handhelds' portrait panels).
ARMADA_PANEL_TYPE=internal
ARMADA_PANEL_ORIENTATION=normal

# No physical controls; touch is primary, external controllers via Bluetooth.
ARMADA_GAMEPAD_QUIRK=none

# The sheng mainline tree supports suspend-to-RAM (s2idle/deep) on SM8550.
ARMADA_SUSPEND_MODE=mem

# No RGB lighting on the tablet.
# The 144Hz LCD panel has no HDR.
ARMADA_HDR_NITS=0

# sheng boots from the Android boot_b partition through the original Xiaomi
# ABL (no UEFI/ESP, no ROCKNIX ABL): the kernel payload is a plain Android
# boot.img flashed with fastboot, and the on-device OTA regen rewrites the
# boot partition instead of an ESP /KERNEL.
ARMADA_BOOTIMG_OUT=/dev/disk/by-partlabel/boot_b
ARMADA_BOOTIMG_STAMP=/var/lib/armada/bootimg.id

# Device-specific boot.img inputs. The sheng kernel tree builds only the
# sheng DTB, and the vendor ABL needs the base-0x00000000 header-v0 geometry
# (the same values debian-sheng passes to mkbootimg).
ARMADA_DTB_LIST=/usr/lib/armada/supported-dtbs.sm7325-nothing-spacewar
ARMADA_BOOTIMG_ARGS_FILE=/usr/lib/armada/bootimg-args.sm7325-nothing-spacewar